<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <linearGradient id="glowPill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="glowPill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-rect { fill: url(#bgGrad); }
      .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.45; }
      .accent-bar { fill: url(#accentGrad); }
      .main-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: url(#textGrad);
        letter-spacing: -0.5px;
      }
      .sub-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .dynamic-float-1 {
        animation: floatA 6s ease-in-out infinite alternate;
      }
      .dynamic-float-2 {
        animation: floatB 7s ease-in-out infinite alternate;
      }
      .dynamic-pulse {
        animation: pulseA 4s ease-in-out infinite;
      }
      @keyframes floatA {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-12px) scale(1.02); }
      }
      @keyframes floatB {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(10px) scale(0.98); }
      }
      @keyframes pulseA {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" class="bg-rect" />

  <!-- Subtle Typographic Grid Lines in Background -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="280" y1="0" x2="280" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="920" y1="0" x2="920" y2="340" />
    <line x1="1080" y1="0" x2="1080" y2="340" />
  </g>

  <!-- Dynamic / Animated Ambient Elements (Positioned safely behind/around) -->
  <g class="dynamic-float-1" transform-origin="1000 90">
    <circle cx="1030" cy="80" r="90" fill="#6366f1" opacity="0.12" filter="url(#glowFilter)" />
    <!-- Typographic glyph 'A' watermark -->
    <text x="1000" y="140" font-family="'Times New Roman', Georgia, serif" font-size="160" font-weight="900" fill="#6366f1" opacity="0.08">Aa</text>
  </g>

  <g class="dynamic-float-2" transform-origin="150 260">
    <circle cx="120" cy="260" r="80" fill="#ec4899" opacity="0.12" filter="url(#glowFilter)" />
    <text x="60" y="300" font-family="'Courier New', Courier, monospace" font-size="110" font-weight="800" fill="#a855f7" opacity="0.07">&amp;</text>
  </g>

  <!-- Ambient Light Orbs with Dynamic Pulse -->
  <circle cx="600" cy="30" r="160" fill="#818cf8" opacity="0.10" filter="url(#glowFilter)" class="dynamic-pulse" />

  <!-- Top Accent Color Bar -->
  <rect x="0" y="0" width="1200" height="5" class="accent-bar" rx="2" />

  <!-- Main Hero Content (Foreground) -->
  <g transform="translate(80, 50)">
    <!-- Category Pill Badge -->
    <g class="dynamic-float-1">
      <rect x="0" y="15" width="270" height="28" rx="14" fill="url(#glowPill1)" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="29" r="4" fill="#a855f7" />
      <text x="26" y="33" class="badge-text" fill="#c7d2fe">✨ MODERN DESIGN ENGINEERING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="92" class="main-title">Awesome Typography &amp; Digital Layout Tools</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="128" class="sub-title">Curated Directory of Open-Source Font Toolchains, Typesetting Engines &amp; High-Craft Layout SaaS</text>

    <!-- Feature Tags / Pills row (Safely below text) -->
    <g transform="translate(0, 160)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" class="badge-text">🖋️ Outline Font Editors</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" class="badge-text">⚡ Typesetting Engines</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(370, 0)">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" class="badge-text">📐 Variable &amp; WOFF2 Tools</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(565, 0)">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" class="badge-text">📖 CSS Paged Media / DTP</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(755, 0)">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" class="badge-text">🌐 Web Typography</text>
      </g>
    </g>

    <!-- Metrics Indicator Bar -->
    <g transform="translate(0, 220)">
      <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
      <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Verified &amp; Maintained Catalog</text>
      <text x="320" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">• 100% Star-Ranked Open-Source Repositories</text>
      <text x="690" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">• Transparent SaaS Pricing &amp; Market Insights</text>
    </g>
  </g>
</svg>
